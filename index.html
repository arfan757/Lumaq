<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumaq</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }
      html, body, #root {
        width: 100%;
        height: 100%;
        background: transparent !important;
        overflow: hidden;
      }
    </style>
    <script>
      window.addEventListener('error', function(e) {
        var errBox = document.getElementById('error-display');
        if (!errBox) {
          errBox = document.createElement('div');
          errBox.id = 'error-display';
          errBox.style = 'position:fixed;inset:10px;background:rgba(20,0,0,0.9);color:#ff5555;padding:15px;border-radius:12px;z-index:999999;font-family:sans-serif;font-size:12px;overflow:auto;';
          document.body.appendChild(errBox);
        }
        errBox.innerHTML += '<b>Error:</b> ' + e.message + '<br/><pre>' + (e.error ? e.error.stack : '') + '</pre><br/>';
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
